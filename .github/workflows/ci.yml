name: Smale Problems CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-lean4:
    name: Verify Lean 4 Proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Check Lean 4 & Lake version
        run: |
          cd test_lean
          lake --version

      - name: Build Mathlib Cache
        run: |
          cd test_lean
          lake exe cache get || true

      - name: Verify Smale Formal Proofs
        run: |
          cd test_lean
          lake env lean Smale07SphereEnergy.lean
          lake env lean Smale14LorenzAttractor.lean
          lake env lean Smale17PolynomialSolving.lean

  verify-latex:
    name: Verify LaTeX Preprints Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended lmodern

      - name: Compile All Preprints
        run: |
          for dir in preprints/*/; do
            if [ -d "$dir" ]; then
              echo "Compiling in $dir..."
              cd "$dir"
              for tex in *.tex; do
                if [ -f "$tex" ]; then
                  pdflatex -interaction=nonstopmode "$tex"
                  pdflatex -interaction=nonstopmode "$tex"
                fi
              done
              cd - > /dev/null
            fi
          done
